name: Java CI/CD with Docker & EC2

on:
  push:
    branches: [ "master" ] # main 브랜치에 push될 때 작동

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. JDK 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle 빌드 (테스트 제외)
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # 4. Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Docker 이미지 빌드 및 Hub에 Push
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/member-demo:latest

      # 6. EC2에 SSH 접속 후 Docker 컨테이너 실행
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 기존 구동 중인 java 프로세스 중지 (기존 app.jar 방식 종료)
            pkill -9 -f 'java' || true
            
            # 기존 컨테이너 중지 및 삭제
            sudo docker stop member-app || true
            sudo docker rm member-app || true
            
            # 최신 이미지 최신화 및 실행
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/member-demo:latest
            # sudo docker run -d -p 8080:8080 --name member-app ${{ secrets.DOCKERHUB_USERNAME }}/member-demo:latest
            sudo docker run -d -p 8080:8080 --memory="512m" --name member-app ${{ secrets.DOCKERHUB_USERNAME }}/member-demo:latest
            # 미사용 이미지 정돈
            sudo docker image prune -f